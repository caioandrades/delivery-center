name: CI/CD - Power BI Fabric Deployment

on:
  pull_request:
    types: [closed]
    branches:
      - develop
      - stagging
      - master

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Power BI Fabric
    runs-on: ubuntu-latest

    # Só executa o job se o PR foi realmente mergeado
    if: github.event.pull_request.merged == true

    env:
      # 🔐 Variáveis de ambiente seguras (armazenadas em GitHub Secrets)
      FABRIC_CLIENT_ID: ${{ secrets.FABRIC_CLIENT_ID }}
      FABRIC_CLIENT_SECRET: ${{ secrets.FABRIC_CLIENT_SECRET }}
      FABRIC_TENANT_ID: ${{ secrets.FABRIC_TENANT_ID }}

    steps:
      # ==============================================================
      # 1️⃣ Baixar o código do repositório
      # ==============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==============================================================
      # 2️⃣ Configurar Python
      # ==============================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      # ==============================================================
      # 3️⃣ Instalar dependências (incluindo Fabric CLI)
      # ==============================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

      - name: Verify Fabric CLI Installation
        run: |
          fab --version
          which fab

      # ==============================================================
      # 4️⃣ Determinar ambiente com base na branch de destino do merge
      # ==============================================================
      - name: Define deployment environment
        id: env
        run: |
          TARGET_BRANCH="${{ github.event.pull_request.base.ref }}"
          echo "🧭 Target branch: $TARGET_BRANCH"

          if [[ "$TARGET_BRANCH" == "develop" ]]; then
            echo "environment=develop" >> $GITHUB_OUTPUT
          elif [[ "$TARGET_BRANCH" == "stagging" ]]; then
            echo "environment=stagging" >> $GITHUB_OUTPUT
          elif [[ "$TARGET_BRANCH" == "master" ]]; then
            echo "environment=main" >> $GITHUB_OUTPUT
          else
            echo "❌ Branch inválida para deploy: $TARGET_BRANCH"
            exit 1
          fi

      # ==============================================================
      # 5️⃣ Executar o script de deploy
      # ==============================================================
      - name: Run deploy script
        working-directory: scripts
        run: |
          echo "🚀 Iniciando deploy para o ambiente: ${{ steps.env.outputs.environment }}"
          python deploy.py --environment ${{ steps.env.outputs.environment }}

      # ==============================================================
      # 6️⃣ Confirmação do processo
      # ==============================================================
      - name: Deployment completed
        run: echo "✅ Deploy do Power BI Fabric concluído com sucesso para o ambiente ${{ steps.env.outputs.environment }}!"
