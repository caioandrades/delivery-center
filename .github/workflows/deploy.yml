name: deploy

on:
  # 1️⃣ Deploy automático apenas em merge de PR
  pull_request:
    types: [closed]
    branches:
      - develop
      - staging
      - master

  # 2️⃣ Deploy manual (para testes)
  workflow_dispatch:
    inputs:
      environment:
        description: 'Choose the target environment'
        required: true
        default: 'develop'
        type: choice
        options:
          - develop
          - staging
          - master

env:
  # Define ambiente dinamicamente: branch alvo do merge ou workflow_dispatch
  environment: ${{ github.event.pull_request.merged && github.event.pull_request.base.ref || github.event.inputs.environment }}

jobs:
  deploy:
    # Só executa se PR fechado for realmente um merge ou se disparado manualmente
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run lint / tests (optional but recommended)
        run: |
          echo "Rodando lint e testes..."
          # Exemplo: pytest tests/ || flake8 src/
          # Se quiser falhar o deploy se testes falharem
          # pytest tests/ --exitfirst --maxfail=1

      - name: Verify Fabric CLI
        run: |
          fab --version
          which fab

      - name: Run deployment script
        env:
          FABRIC_CLIENT_ID: ${{ secrets.FABRIC_CLIENT_ID }}
          FABRIC_CLIENT_SECRET: ${{ secrets.FABRIC_CLIENT_SECRET }}
          FABRIC_TENANT_ID: ${{ secrets.FABRIC_TENANT_ID }}
        run: |
          echo "Deploying to environment: ${{ env.environment }}"
          python scripts/deploy.py --spn-auth --environment ${{ env.environment }}

      - name: Deployment Success Notification
        if: ${{ success() }}
        run: echo "Deployed successfuly in ${{ env.environment }}"

      - name: Deployment Failure Notification
        if: ${{ failure() }}
        run: echo "Deploy has faleid ${{ env.environment }}. Check logs."
